[project]
name = "neuroscan"
version = "2.1.0"
description = "Brain MRI tumor classification: calibrated multi-model ensemble with Grad-CAM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Serving dependencies only - this is what Vercel installs. Keep identical to
# requirements.txt (checked by tests/test_deployment.py).
dependencies = [
    "fastapi>=0.110,<1",
    "python-multipart>=0.0.9,<1",
    "numpy>=1.26,<3",
    "pillow>=10.3,<14",
    "onnxruntime>=1.18,<2",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
train = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "onnx>=1.16,<2",
]
dev = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "onnx>=1.16,<2",
    "pytest>=8.0",
    "httpx>=0.27",
    "ipykernel>=6.29",
]

# Vercel: deploy server.py's FastAPI `app`. Explicit because the repository
# root also contains app.py (the optional Gradio UI), another zero-config
# entrypoint candidate.
[tool.vercel]
entrypoint = "server:app"

[tool.uv]
package = false
